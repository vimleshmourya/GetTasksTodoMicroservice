apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: get-tasks-ingress
  annotations:
    kubernetes.io/ingress.class: azure/application-gateway
spec:
 ingressClassName: azure-application-gateway
  rules:
  - host: gettask.copcare.shop
    http:
      paths:
      - pathType: Prefix
        path: "/"
        backend:
          service:
            name: get-tasks
            port: 
              number: 80
